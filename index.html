<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>হুজাইফা পাঞ্জাবী টেইলার্স</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141d2a;--bg2:#1f2d3f;--panel:#243548;--panel2:#2b3f56;--ink:#eef3f8;--muted:#9fb0c3;--or:#f5a524;--or2:#e8741c;--line:rgba(255,255,255,.08);--top:rgba(20,29,42,.85);--glow:#2a3f57;--ic:#15212f;--ok:#2ecc71;--bad:#ff6b6b;--shadow:0 10px 28px rgba(0,0,0,.3)}
*{box-sizing:border-box;scrollbar-width:thin}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 600px at 10% -10%,var(--glow),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,.link-btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2));box-shadow:0 6px 16px rgba(232,116,28,.28);font-weight:600;transition:transform .15s,filter .15s;text-decoration:none;display:inline-block}
button:hover{transform:translateY(-1px);filter:brightness(1.05)}
button:active{transform:scale(.98)}
button.sec{background:var(--panel2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.danger{background:linear-gradient(135deg,#ff7675,#d63031)}
button.ghost{background:none;box-shadow:none;color:var(--muted);border:1px solid var(--line)}
button.sm{padding:6px 11px;font-size:.82rem;border-radius:10px}
.link-btn{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 6px 16px rgba(37,211,102,.25)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(245,165,36,.2)}
input[readonly]{color:var(--or);font-weight:700;background:var(--bg2)}
input.mon{width:auto}
option{background:var(--panel);color:var(--ink)}
::placeholder{color:var(--muted);opacity:.7}
label{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
h2,h3{margin:0}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--top);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid var(--or);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{width:58%;height:58%}
.bn{min-width:0}
.bn .big{display:block;font-size:1.5rem;font-weight:700;line-height:1.1}
.bn .sub{display:block;font-size:.8rem;color:var(--or);font-weight:600}
.bn .addr{display:block;font-size:.84rem;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{display:inline-block;margin-top:3px;font-size:.52rem;font-weight:600;color:#8fd9ad;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.3);padding:1px 7px;border-radius:99px;line-height:1.4}
.homebtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:none;padding:0;display:grid;place-items:center;color:var(--ink);font-size:1.2rem;flex:0 0 auto}
main{max-width:980px;margin:0 auto;padding:14px 16px 100px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.page-h h2{font-size:1.25rem}
.crumb{display:flex;align-items:center;gap:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1rem;margin-bottom:10px;color:var(--or)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:.8rem}
.kpi b{font-size:1.25rem}
.kpi.warn b{color:var(--bad)}
.kpi.ok b{color:var(--ok)}
.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 18px}
.menu button{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:16px 4px 14px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .2s,border-color .2s}
.menu button:hover{transform:translateY(-3px);border-color:var(--c)}
.menu .ic{width:72px;height:72px;border-radius:50%;background:var(--ic);border:2.5px solid var(--c);display:grid;place-items:center;color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 14%,transparent)}
.menu .ic svg{width:32px;height:32px}
.menu span{font-weight:700;font-size:.92rem}
.menu [data-go=accounts]{order:1}
.menu [data-go=settings]{order:2}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);box-shadow:none;padding:6px 12px;border-radius:99px;font-size:.82rem}
.chip.on{background:var(--or);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;transition:transform .15s,border-color .15s}
.row:hover{transform:translateX(3px);border-color:rgba(245,165,36,.4)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;font-size:1rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-pending{background:rgba(245,165,36,.18);color:#f5a524}
.b-cut{background:rgba(52,152,219,.2);color:#5dade2}
.b-ready{background:rgba(155,89,182,.2);color:#c39bd3}
.b-done{background:rgba(46,204,113,.2);color:#2ecc71}
.b-new{background:rgba(149,165,166,.2);color:#bdc3c7}
.amt-in{color:var(--ok);font-weight:700}
.amt-out{color:#ff7675;font-weight:700}
.due{color:var(--bad);font-weight:700}
.paid{color:var(--ok);font-weight:700}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px}
.meas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border:0}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;font-size:.9rem}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.track i.income{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.track i.expense{background:linear-gradient(90deg,#ff7675,#e74c3c)}
.sumc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.sc{border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow)}
.sc small{display:block;opacity:.9;font-size:.82rem}
.sc b{font-size:1.4rem}
.sc.inc{background:linear-gradient(135deg,#27ae60,#1e8449)}
.sc.exp{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.sc.pos{background:linear-gradient(135deg,#2980b9,#1f618d)}
.sc.neg{background:linear-gradient(135deg,#8e44ad,#6c3483)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:none}
.tile:hover{border-color:var(--or)}
.tile small{color:var(--muted);font-size:.78rem;font-weight:400}
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:9px 10px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel2)}
tr:nth-child(even) td{background:var(--bg2)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;padding:0;display:grid;place-items:center;z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.tpanel{position:fixed;right:14px;bottom:84px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 16px 36px rgba(0,0,0,.45);z-index:31}
.tp-t{font-weight:700;color:var(--or);margin-bottom:4px}
.tp-o{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:10px 12px;border-radius:12px;margin-top:8px;text-align:left}
.tp-o.on{border-color:var(--or);box-shadow:0 0 0 2px rgba(245,165,36,.25)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(92vw,380px)}
.t{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--or);color:var(--ink);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);animation:tin .25s ease}
.t.ok{border-left-color:var(--ok)}
.t.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:20px}
.mbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:20px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox h3{color:var(--ink);font-size:1.1rem}
.mbox p{color:var(--muted);margin:8px 0 16px}
.mact{display:flex;gap:10px;justify-content:flex-end}
.view{animation:vin .28s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#receipt{display:none}
@media print{
  #receipt{display:block!important;background:#fff;color:#000;padding:24px;font-family:sans-serif}
  #receipt th{background:#fff!important;color:#000!important}
  #receipt td{color:#000!important;background:#fff!important}
  body.printing .top,body.printing main,body.printing .fab,body.printing #toast,body.printing .tpanel{display:none!important}
  body.printing{background:#fff}
}
@media (max-width:600px){
  .menu .ic{width:62px;height:62px}
  .menu .ic svg{width:26px;height:26px}
  .menu span{font-size:.82rem}
  .menu button{padding:14px 4px 12px}
  .g2{grid-template-columns:1fr}
  .bn .big{font-size:1.25rem}
