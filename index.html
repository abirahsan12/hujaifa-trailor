<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>হুজাইফা পাঞ্জাবী টেইলার্স</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141d2a;--bg2:#1f2d3f;--panel:#243548;--panel2:#2b3f56;--ink:#eef3f8;--muted:#9fb0c3;--or:#f5a524;--or2:#e8741c;--line:rgba(255,255,255,.08);--top:rgba(20,29,42,.85);--glow:#2a3f57;--ic:#15212f;--ok:#2ecc71;--bad:#ff6b6b;--shadow:0 10px 28px rgba(0,0,0,.3)}
*{box-sizing:border-box;scrollbar-width:thin}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 600px at 10% -10%,var(--glow),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,.link-btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2));box-shadow:0 6px 16px rgba(232,116,28,.28);font-weight:600;transition:transform .15s,filter .15s;text-decoration:none;display:inline-block}
button:hover{transform:translateY(-1px);filter:brightness(1.05)}
button:active{transform:scale(.98)}
button.sec{background:var(--panel2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.danger{background:linear-gradient(135deg,#ff7675,#d63031)}
button.ghost{background:none;box-shadow:none;color:var(--muted);border:1px solid var(--line)}
button.sm{padding:6px 11px;font-size:.82rem;border-radius:10px}
.link-btn{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 6px 16px rgba(37,211,102,.25)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(245,165,36,.2)}
input[readonly]{color:var(--or);font-weight:700;background:var(--bg2)}
input.mon{width:auto}
option{background:var(--panel);color:var(--ink)}
::placeholder{color:var(--muted);opacity:.7}
label{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
h2,h3{margin:0}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--top);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid var(--or);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{width:58%;height:58%}
.bn{min-width:0}
.bn .big{display:block;font-size:1.5rem;font-weight:700;line-height:1.1}
.bn .sub{display:block;font-size:.8rem;color:var(--or);font-weight:600}
.bn .addr{display:block;font-size:.84rem;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{display:inline-block;margin-top:3px;font-size:.52rem;font-weight:600;color:#8fd9ad;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.3);padding:1px 7px;border-radius:99px;line-height:1.4}
.homebtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:none;padding:0;display:grid;place-items:center;color:var(--ink);font-size:1.2rem;flex:0 0 auto}
main{max-width:980px;margin:0 auto;padding:14px 16px 100px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.page-h h2{font-size:1.25rem}
.crumb{display:flex;align-items:center;gap:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1rem;margin-bottom:10px;color:var(--or)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:.8rem}
.kpi b{font-size:1.25rem}
.kpi.warn b{color:var(--bad)}
.kpi.ok b{color:var(--ok)}
.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 18px}
.menu button{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:16px 4px 14px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .2s,border-color .2s}
.menu button:hover{transform:translateY(-3px);border-color:var(--c)}
.menu .ic{width:72px;height:72px;border-radius:50%;background:var(--ic);border:2.5px solid var(--c);display:grid;place-items:center;color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 14%,transparent)}
.menu .ic svg{width:32px;height:32px}
.menu span{font-weight:700;font-size:.92rem}
.menu [data-go=accounts]{order:1}
.menu [data-go=settings]{order:2}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);box-shadow:none;padding:6px 12px;border-radius:99px;font-size:.82rem}
.chip.on{background:var(--or);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;transition:transform .15s,border-color .15s}
.row:hover{transform:translateX(3px);border-color:rgba(245,165,36,.4)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;font-size:1rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-pending{background:rgba(245,165,36,.18);color:#f5a524}
.b-cut{background:rgba(52,152,219,.2);color:#5dade2}
.b-ready{background:rgba(155,89,182,.2);color:#c39bd3}
.b-done{background:rgba(46,204,113,.2);color:#2ecc71}
.b-new{background:rgba(149,165,166,.2);color:#bdc3c7}
.amt-in{color:var(--ok);font-weight:700}
.amt-out{color:#ff7675;font-weight:700}
.due{color:var(--bad);font-weight:700}
.paid{color:var(--ok);font-weight:700}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px}
.meas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border:0}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;font-size:.9rem}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.track i.income{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.track i.expense{background:linear-gradient(90deg,#ff7675,#e74c3c)}
.sumc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.sc{border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow)}
.sc small{display:block;opacity:.9;font-size:.82rem}
.sc b{font-size:1.4rem}
.sc.inc{background:linear-gradient(135deg,#27ae60,#1e8449)}
.sc.exp{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.sc.pos{background:linear-gradient(135deg,#2980b9,#1f618d)}
.sc.neg{background:linear-gradient(135deg,#8e44ad,#6c3483)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:none}
.tile:hover{border-color:var(--or)}
.tile small{color:var(--muted);font-size:.78rem;font-weight:400}
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:9px 10px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel2)}
tr:nth-child(even) td{background:var(--bg2)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;padding:0;display:grid;place-items:center;z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.tpanel{position:fixed;right:14px;bottom:84px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 16px 36px rgba(0,0,0,.45);z-index:31}
.tp-t{font-weight:700;color:var(--or);margin-bottom:4px}
.tp-o{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:10px 12px;border-radius:12px;margin-top:8px;text-align:left}
.tp-o.on{border-color:var(--or);box-shadow:0 0 0 2px rgba(245,165,36,.25)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(92vw,380px)}
.t{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--or);color:var(--ink);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);animation:tin .25s ease}
.t.ok{border-left-color:var(--ok)}
.t.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:20px}
.mbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:20px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox h3{color:var(--ink);font-size:1.1rem}
.mbox p{color:var(--muted);margin:8px 0 16px}
.mact{display:flex;gap:10px;justify-content:flex-end}
.view{animation:vin .28s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#receipt{display:none}
@media print{
  #receipt{display:block!important;background:#fff;color:#000;padding:24px;font-family:sans-serif}
  #receipt th{background:#fff!important;color:#000!important}
  #receipt td{color:#000!important;background:#fff!important}
  body.printing .top,body.printing main,body.printing .fab,body.printing #toast,body.printing .tpanel{display:none!important}
  body.printing{background:#fff}
}
@media (max-width:600px){
  .menu .ic{width:62px;height:62px}
  .menu .ic svg{width:26px;height:26px}
  .menu span{font-size:.82rem}
  .menu button{padding:14px 4px 12px}
  .g2{grid-template-columns:1fr}
  .bn .big{font-size:1.25rem}

/* ---------- ডাটা ---------- */
function recalc(o){ o.total = (+o.qty || 0) * (+o.price || 0); o.due = Math.max(0, o.total - (+o.paid || 0)); }
function norm(d){
  const s = Object.assign({name:"হুজাইফা পাঞ্জাবি টেইলার্স এন্ড ফেব্রিক্স", addr:"চকরামপুর বাজার, ত্রিশাল, ময়মনসিংহ", logo:""}, d.settings || {});
  if (s.name === "আমার টেইলার্স") s.name = "হুজাইফা পাঞ্জাবি টেইলার্স এন্ড ফেব্রিক্স";
  delete s.phone;
  const customers = d.customers || [], orders = d.orders || [], employees = d.employees || [], txs = d.txs || [];
  const mx = a => a.reduce((m,x) => Math.max(m, +x.id || 0), 0);
  const sq = d.seq || {};
  orders.forEach(o => { o.paid = +o.paid || 0; o.m = o.m || {}; recalc(o); });
  return {customers, orders, employees, txs, settings:s, seq:{
    c: Math.max(sq.c || 0, sq.customer || 0, mx(customers)),
    o: Math.max(sq.o || 0, sq.order || 0, mx(orders)),
    e: Math.max(sq.e || 0, sq.employee || 0, mx(employees)),
    t: Math.max(sq.t || 0, mx(txs))
  }};
}
function loadDB(){ try { const d = JSON.parse(localStorage.getItem("tms_db")); if (d) return norm(d); } catch(e){} return norm({}); }
let DB = loadDB();
let CUR = {v:"home", p:null};

function save(){ try { localStorage.setItem("tms_db", JSON.stringify(DB)); } catch(e){} pushCloud(); }
const nid = k => (DB.seq[k] = (DB.seq[k] || 0) + 1);
const cust = id => DB.customers.find(c => c.id == id);
const cname = id => (cust(id) || {}).name || "—";
const ordr = id => DB.orders.find(o => o.id == id);
const colOf = k => DB[k === "c" ? "customers" : k === "o" ? "orders" : "employees"];

/* ---------- লেনদেন ও হিসাব ---------- */
function pushTx(t){ DB.txs.push({id:nid("t"), date:t.date || today(), type:t.type, cat:t.cat, amt:+t.amt || 0, note:t.note || "", ref:t.ref || "", month:t.month || ""}); save(); }
function monthTx(m){ return DB.txs.filter(t => String(t.date || "").startsWith(m)); }
function sumTx(type, m){ return DB.txs.filter(t => t.type === type && (!m || String(t.date).startsWith(m))).reduce((s,t) => s + (+t.amt || 0), 0); }
function addPay(o, amt, date){
  amt = +amt; if (amt <= 0) return false;
  o.paid = (+o.paid || 0) + amt; recalc(o);
  pushTx({type:"income", cat:"অর্ডার আয়", amt, date, note:cname(o.cust) + " — " + o.item, ref:"o" + o.id});
  return true;
}
function removeTx(id){
  const t = DB.txs.find(x => x.id == id); if (!t) return;
  if (/^o\d+$/.test(t.ref || "")) { const o = ordr(t.ref.slice(1)); if (o) { o.paid = Math.max(0, (+o.paid || 0) - t.amt); recalc(o); } }
  DB.txs = DB.txs.filter(x => x.id != id); save();
}

/* ---------- ক্লাউড সিঙ্ক (PIN + Supabase Edge Function) ---------- */
let SB_PIN = "";
// dirty = এমন তথ্য আছে যা এখনো Supabase-এ পৌঁছায়নি (ফোনে সেভ আছে, ক্লাউডে বাকি)
const SYNC = {synced:{}, ready:false, q:Promise.resolve(), ver:0, dirty:false};
try { SYNC.dirty = localStorage.getItem("tms_dirty") === "1"; } catch(e){}
const PREFIX = {customers:"c", orders:"o", employees:"e", txs:"t"};
function setSync(t){ const el = $("#sync"); if (el) el.textContent = t; }
function setDirty(v){ SYNC.dirty = !!v; try { localStorage.setItem("tms_dirty", v ? "1" : "0"); } catch(e){} }
function refreshSyncText(){
  if (!SB_PIN) return;
  setSync(SYNC.dirty ? "⏳ ক্লাউডে সেভ বাকি" : "☁️ ক্লাউডে সুরক্ষিত");
}
function syncUrl(){ return String(window.SUPABASE_URL || "").replace(/\/$/, "") + "/functions/v1/sync"; }
async function callSync(body){
  const res = await fetch(syncUrl(), {
    method: "POST",
    headers: {"Content-Type": "application/json", "apikey": window.SUPABASE_ANON_KEY, "Authorization": "Bearer " + window.SUPABASE_ANON_KEY},
    body: JSON.stringify(Object.assign({pin: SB_PIN}, body))
  });
  let json = {}; try { json = await res.json(); } catch(e){}
  if (!res.ok) { const err = new Error(json.error || ("HTTP " + res.status)); err.status = res.status; throw err; }
  return json;
}
function isConfigured(){
  return !!window.SUPABASE_URL && !String(window.SUPABASE_URL).includes("YOUR-PROJECT")
    && !!window.SUPABASE_ANON_KEY && !String(window.SUPABASE_ANON_KEY).includes("YOUR-ANON-KEY");
}
function showGate(msg){
  document.body.classList.add("locked");
  $("#gateTitle").textContent = "PIN দিন";
  $("#gateMsg").textContent = msg || "অ্যাডমিন PIN দিয়ে অ্যাপ খুলুন।";
  $("#gatePin").pin.value = "";
}
function unlockApp(){ document.body.classList.remove("locked"); }
// লক করলে ফোনের কপি মুছে যায়; তবে ক্লাউডে না যাওয়া তথ্য থাকলে লক হবে না
function lockApp(msg){
  if (SYNC.dirty) return toast("কিছু তথ্য এখনো ক্লাউডে যায়নি। ইন্টারনেট দেখে কিছুক্ষণ পর আবার চেষ্টা করুন।", "bad");
  SB_PIN = ""; SYNC.ready = false; SYNC.synced = {};
  try { localStorage.removeItem("tms_db"); } catch(e){}
  DB = norm({});
  render(); showGate(msg);
}
async function doPush(){
  if (!SB_PIN || !SYNC.ready) return;
  const startVer = SYNC.ver;
  const cur = {};
  for (const [k,p] of Object.entries(PREFIX)) (DB[k] || []).forEach(r => { cur[p + r.id] = r; });
  cur.meta = {seq:DB.seq, settings:DB.settings};
  const upserts = [], changed = [];
  for (const [rid, r] of Object.entries(cur)) {
    const s = JSON.stringify(r);
    if (SYNC.synced[rid] !== s) { upserts.push({rid, data:r}); changed.push([rid, s]); }
  }
  const removed = Object.keys(SYNC.synced).filter(rid => !(rid in cur));
  if (!upserts.length && !removed.length) { setDirty(false); refreshSyncText(); return; }
  try {
    await callSync({action:"push", upserts, removed});
    changed.forEach(([rid, s]) => { SYNC.synced[rid] = s; });
    removed.forEach(rid => { delete SYNC.synced[rid]; });
    setDirty(SYNC.ver !== startVer);
    refreshSyncText();
  } catch(e) {
    setDirty(true);
    setSync("⏳ ক্লাউডে সেভ বাকি (ইন্টারনেট দেখুন)");
  }
}
// প্রতিটি পরিবর্তনে: ফোনে সেভ + ক্লাউডে পাঠানোর জন্য সারিতে যোগ
function pushCloud(){
  SYNC.ver++;
  setDirty(true);
  if (!SYNC.ready) return;
  SYNC.q = SYNC.q.then(doPush);
}
// বাকি থাকা তথ্য আবার পাঠানোর চেষ্টা: নেটওয়ার্ক ফিরে এলে বা প্রতি ২০ সেকেন্ডে
function pushNow(){
  if (!SYNC.ready || !SB_PIN) return;
  SYNC.q = SYNC.q.then(doPush);
}
setInterval(() => { if (SYNC.dirty) pushNow(); }, 20000);
window.addEventListener("online", () => { if (SYNC.dirty) pushNow(); });
// ক্লাউডে না যাওয়া তথ্য থাকলে পাতা বন্ধ করার আগে সতর্ক করা
window.addEventListener("beforeunload", e => { if (SYNC.dirty) { e.preventDefault(); e.returnValue = ""; } });
async function pullCloud(){
  const json = await callSync({action:"pull"});
  const rows = json.rows || [];
  if (!rows.length) return false;
  const nd = {customers:[], orders:[], employees:[], txs:[], seq:{}, settings:DB.settings};
  const rev = {c:"customers", o:"orders", e:"employees", t:"txs"};
  rows.forEach(row => {
    SYNC.synced[row.rid] = JSON.stringify(row.data);
    if (row.rid === "meta") { nd.seq = row.data.seq || {}; nd.settings = row.data.settings || nd.settings; }
    else nd[rev[row.rid[0]]].push(row.data);
  });
  DB = norm(nd);
  try { localStorage.setItem("tms_db", JSON.stringify(DB)); } catch(e){}
  return true;
}
async function afterUnlock(){
  SYNC.ready = true;
  try {
    if (SYNC.dirty) {
      // ফোনে যা বাকি আছে আগে ক্লাউডে পাঠাই, তারপর চালিয়ে যাই
      render();
      await doPush();
    } else {
      const had = await pullCloud();
      render();
      if (!had) await doPush();
    }
    refreshSyncText();
  } catch(e) { render(); setSync("⚠️ ক্লাউড সংযোগ ব্যর্থ"); }
}
async function pinUnlock(pin){
  const msg = $("#gateMsg");
  SB_PIN = pin; msg.textContent = "যাচাই হচ্ছে...";
  try {
    await callSync({action:"check"});
  } catch(e) {
    SB_PIN = "";
    msg.textContent = e.status === 429 ? "অনেকবার ভুল PIN হয়েছে। অ্যাডমিনের সাথে যোগাযোগ করুন।"
      : e.status === 401 ? "PIN ভুল হয়েছে।"
      : "সংযোগ করা যায়নি। ইন্টারনেট দেখুন।";
    return;
  }
  unlockApp();
  await afterUnlock();
}
async function cloudRestore(){
  if (!SB_PIN) return toast("আগে অ্যাপ আনলক করুন", "bad");
  if (SYNC.dirty) return toast("আগে বাকি তথ্য ক্লাউডে যাক, তারপর আনুন", "bad");
  try { const ok = await pullCloud(); render(); toast(ok ? "ক্লাউড থেকে তথ্য আনা হয়েছে" : "ক্লাউডে কোনো তথ্য নেই", ok ? "ok" : ""); }
  catch(e) { toast("ক্লাউড থেকে আনা যায়নি", "bad"); }
}
function startApp(){
  $("#gatePin").onsubmit = e => { e.preventDefault(); const pin = (e.target.pin.value || "").trim(); if (pin) pinUnlock(pin); };
  if (!isConfigured()) { SB_PIN = ""; return showGate("সেটআপ সম্পন্ন হয়নি। config.js-এ Supabase তথ্য বসান।"); }
  showGate();
}

function toast(msg, type = ""){
  const el = document.createElement("div"); el.className = "t " + type; el.textContent = msg;
  $("#toast").appendChild(el); setTimeout(() => el.remove(), 2600);
}
function ask(title, text, ok = "নিশ্চিত", danger = false){
  return new Promise(res => {
    const m = $("#modal"), y = $("#mYes"), n = $("#mNo");
    $("#mTitle").textContent = title; $("#mText").textContent = text;
    y.textContent = ok; y.className = danger ? "danger" : "";
    m.hidden = false;
    const done = v => { m.hidden = true; y.onclick = n.onclick = m.onclick = null; modalDone = null; res(v); };
    modalDone = done;
    y.onclick = () => done(true); n.onclick = () => done(false);
    m.onclick = ev => { if (ev.target === m) done(false); };
  });
}

let EMP_PHOTO = null;
function avImg(src){ return `<span class="av" style="background:none;overflow:hidden"><img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`; }
function handleEmpPhoto(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const sc = Math.min(1, 200 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    EMP_PHOTO = c.toDataURL("image/jpeg", 0.85);
    URL.revokeObjectURL(url);
    const box = document.getElementById("empPrevBox");
    if (box) box.innerHTML = `<img src="${EMP_PHOTO}" alt="" style="width:100%;height:100%;object-fit:cover">`;
    toast("ছবি নির্বাচিত হয়েছে", "ok");
  };
  img.onerror = () => toast("ছবিটি খোলা যায়নি", "bad");
  img.src = url;
}

  if (p.startsWith("01")) p = "880" + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
};

function listRows(kind){
  const q = (LQ[kind] || "").toLowerCase();
  if (kind === "customer") {
    const rows = DB.customers.filter(c => (c.name + " " + (c.mobile || "")).toLowerCase().includes(q)).sort((a,b) => b.id - a.id);
    if (!rows.length) return empty("কোনো কাস্টমার নেই");
    return rows.map(c => {
      const last = DB.orders.filter(o => o.cust == c.id).sort((a,b) => b.id - a.id)[0];
      return row(av(c.name), c.name, c.mobile || "মোবাইল নেই", last ? sbadge(last.status) : '<span class="badge b-new">নতুন</span>', "cprofile", c.id);
    }).join("");
  }
  if (kind === "order") {
    const f = LF.order || "all";
    const rows = DB.orders.filter(o => (f === "all" || o.status === f) && (cname(o.cust) + " " + o.item).toLowerCase().includes(q))
      .sort((a,b) => String(a.ddate || "9999").localeCompare(String(b.ddate || "9999")));
    if (!rows.length) return empty("কোনো অর্ডার নেই");
    return rows.map(o => row(av(cname(o.cust)), cname(o.cust) + " — " + o.item, "ডেলিভারি: " + (o.ddate || "—"),
      sbadge(o.status) + `<div class="${o.due > 0 ? "due" : "paid"}">${o.due > 0 ? money(o.due) + " বাকি" : "পরিশোধিত"}</div>`, "odetail", o.id)).join("");
  }
  const rows = DB.employees.filter(e => (e.name + " " + e.job).toLowerCase().includes(q)).sort((a,b) => b.id - a.id);

    <div class="card"><h3>কর্মচারী বেতন — ${monthLabel(m)}</h3>${wages || '<p class="muted">কোনো কর্মচারী নেই।</p>'}</div>

  const fd = new FormData(f), name = String(fd.get("name") || "").trim();
  if (!name) return toast("নাম লিখুন", "bad");
  const data = {name, mobile:String(fd.get("mobile") || "").trim(), gender:fd.get("gender"), email:String(fd.get("email") || "").trim(), addr:String(fd.get("addr") || "").trim(), notes:String(fd.get("notes") || "").trim()};
  let id = f.dataset.id;
  if (id && cust(id)) Object.assign(cust(id), data); else { id = nid("c"); DB.customers.push(Object.assign({id}, data)); }
  save(); toast("কাস্টমার সেভ হয়েছে", "ok"); go("cprofile", {id:+id}, "replace");
}
function saveOrder(f){
  const fd = new FormData(f), cu = +fd.get("cust");
  if (!cu) return toast("কাস্টমার নির্বাচন করুন", "bad");
  const item = fd.get("item"), m = {};
  (MEAS[item] || []).forEach((k,i) => { const v = String(fd.get("m" + i) || "").trim(); if (v) m[k] = v; });
  const base = {cust:cu, item, odate:fd.get("odate") || today(), ddate:fd.get("ddate") || "", qty:+fd.get("qty") || 1, price:+fd.get("price") || 0, status:fd.get("status"), notes:String(fd.get("notes") || "").trim(), m};
  let id = f.dataset.id;
  if (id && ordr(id)) { const o = ordr(id); Object.assign(o, base); recalc(o); }
  else {
    const o = Object.assign({id:nid("o"), paid:0}, base); recalc(o); DB.orders.push(o); id = o.id;
    const adv = +fd.get("adv") || 0; if (adv > 0) addPay(o, adv, base.odate);
  }
  save(); toast("অর্ডার সেভ হয়েছে", "ok"); go("odetail", {id:+id}, "replace");
}
function saveEmp(f){
  const fd = new FormData(f), name = String(fd.get("name") || "").trim();
  if (!name) return toast("নাম লিখুন", "bad");
  const data = {name, addr:String(fd.get("addr") || "").trim(), paddr:String(fd.get("paddr") || "").trim(), mobile:String(fd.get("mobile") || "").trim(), dob:fd.get("dob") || "", gender:fd.get("gender"), job:fd.get("job"), join:fd.get("join") || "", leave:fd.get("leave") || "", month:fd.get("month"), basic:+fd.get("basic") || 0, extra:+fd.get("extra") || 0, bonus:+fd.get("bonus") || 0};
  data.total = data.basic + data.extra + data.bonus;
  if (EMP_PHOTO !== null) data.photo = EMP_PHOTO;
  let id = f.dataset.id;
  if (id && colOf("e").find(x => x.id == id)) Object.assign(colOf("e").find(x => x.id == id), data); else if (!id) { id = nid("e"); DB.employees.push(Object.assign({id}, data)); }
  save(); toast("কর্মচারী সেভ হয়েছে", "ok"); go("employee", null, "replace");
}
function saveTx(f){
  const fd = new FormData(f), amt = +fd.get("amt") || 0;
  if (amt <= 0) return toast("সঠিক পরিমাণ লিখুন", "bad");
  pushTx({type:fd.get("type"), cat:fd.get("cat"), amt, date:fd.get("date") || today(), note:String(fd.get("note") || "").trim()});
  toast("লেনদেন যোগ হয়েছে", "ok"); render();
}
function addPayForm(f){
  const o = ordr(f.dataset.id), amt = +new FormData(f).get("amt") || 0;
  if (!o || amt <= 0) return toast("সঠিক পরিমাণ লিখুন", "bad");
  addPay(o, amt, f.date.value || today()); save(); toast("পেমেন্ট যোগ হয়েছে", "ok"); render();
}
function saveSettings(f){
  DB.settings.name = String(f.name.value || "").trim() || DB.settings.name;
  DB.settings.addr = String(f.addr.value || "").trim();
  save(); toast("সেভ হয়েছে", "ok"); render();
}
function handleLogo(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    // Crop the centre square so the logo fills the round frame exactly
    const side = Math.min(img.width, img.height);
    const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    c.getContext("2d").drawImage(img, sx, sy, side, side, 0, 0, 256, 256);
    DB.settings.logo = c.toDataURL("image/png");
    URL.revokeObjectURL(url); save(); render(); toast("লোগো সেভ হয়েছে", "ok");
  };
  img.onerror = () => toast("ছবিটি খোলা যায়নি", "bad");
  img.src = url;
}

/* ---------- প্রিন্ট ---------- */
function printDoc(title, body){
  const s = DB.settings, r = document.getElementById("receipt");
  r.innerHTML = `<div style="text-align:center">${s.logo ? `<img src="${s.logo}" style="width:72px;height:72px;object-fit:contain">` : ""}<h2 style="margin:6px 0">${esc(s.name)}</h2><div>${esc(s.addr)}</div><hr><h3>${esc(title)}</h3></div>${body}`;
  document.body.classList.add("printing");
  const off = () => document.body.classList.remove("printing");
  window.onafterprint = off; setTimeout(off, 15000);
  if (window.AndroidPrint) { off(); const st = '<style>body{font-family:sans-serif;color:#000;padding:20px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:6px;text-align:left;font-size:12px}</style>'; AndroidPrint.printHtml('<!DOCTYPE html><html><head><meta charset="utf-8">' + st + '</head><body>' + r.innerHTML + '</body></html>'); return; }
  window.print();
}
function openReceipt(id){
  const o = ordr(id); if (!o) return;
  const meas = Object.keys(o.m || {}).length ? tbl(["মাপ", "ইঞ্চি"], Object.entries(o.m)) : "";
  printDoc("অর্ডার রশিদ #" + o.id, tbl(["বিবরণ","তথ্য"], [["কাস্টমার", cname(o.cust)], ["পণ্য", o.item], ["অর্ডার তারিখ", o.odate || "—"], ["ডেলিভারি তারিখ", o.ddate || "—"], ["পরিমাণ", bn(o.qty)], ["মোট মূল্য", money(o.total)], ["পরিশোধ", money(o.paid)], ["বকেয়া", money(o.due)], ["নোটস", o.notes || "—"]]) + meas + '<p style="margin-top:40px">কাস্টমারের স্বাক্ষর: ______________</p>');
}

/* ---------- ইভেন্ট ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("[data-back]")) { if (DEPTH > 0) history.back(); else go("home", null, "replace"); return; }
  const nav = t.closest("[data-go]");
  if (nav) {
    const d = nav.dataset; let p = null;
    if (d.id) p = {id:+d.id}; else if (d.cust) p = {cust:+d.cust}; else if (d.item) p = {item:d.item}; else if (d.type) p = d.type; else if (d.month) p = d.month;
    return go(d.go, p, true);
  }
  const chip = t.closest("[data-chip]"); if (chip) { LF.order = chip.dataset.chip; return render(); }
  const st = t.closest("[data-status]");
  if (st) { const o = ordr(st.dataset.status); if (o) { o.status = st.dataset.val; save(); render(); } return; }
  const th = t.closest("[data-theme]"); if (th) { applyTheme(th.dataset.theme); if (CUR.v === "settings") render(); return; }
  const dp = t.closest("[data-delpay]");
  if (dp) { if (await ask("পেমেন্ট মুছবেন?", "এই পেমেন্টের টাকা অর্ডারের পরিশোধ থেকে বাদ যাবে।", "মুছুন", true)) { removeTx(dp.dataset.delpay); toast("পেমেন্ট মুছে গেছে"); render(); } return; }
  const dt = t.closest("[data-deltx]");
  if (dt) { if (await ask("লেনদেন মুছবেন?", "এটি খাতা থেকে মুছে যাবে।", "মুছুন", true)) { removeTx(dt.dataset.deltx); render(); } return; }
  const dord = t.closest("[data-delorder]");
  if (dord) {
    const id = dord.dataset.delorder;
    if (await ask("অর্ডার মুছবেন?", "এই অর্ডারের সব পেমেন্টের হিসাবও মুছে যাবে।", "মুছুন", true)) {
      DB.orders = DB.orders.filter(o => o.id != id); DB.txs = DB.txs.filter(x => x.ref !== "o" + id); save();
      toast("অর্ডার মুছে গেছে"); go("order", null, "replace");
    }
    return;
  }
  const dc = t.closest("[data-delc]");
  if (dc) {
    const id = dc.dataset.delc, n = DB.orders.filter(o => o.cust == id).length;
    if (await ask("কাস্টমার মুছবেন?", n ? `এই কাস্টমারের ${bn(n)} টি অর্ডার আছে। কাস্টমার মুছে গেলে ওই অর্ডারে নাম আর দেখাবে না।` : "এটি স্থায়ীভাবে মুছে যাবে।", "মুছুন", true)) {
      DB.customers = DB.customers.filter(c => c.id != id); save(); toast("কাস্টমার মুছে গেছে"); go("customer", null, "replace");
    }
    return;
  }
  const de = t.closest("[data-dele]");
  if (de) {
    if (await ask("কর্মচারী মুছবেন?", "এটি স্থায়ীভাবে মুছে যাবে।", "মুছুন", true)) {
      const id = de.dataset.dele; DB.employees = DB.employees.filter(x => x.id != id); save(); toast("কর্মচারী মুছে গেছে"); go("employee", null, "replace");
    }
    return;
  }
  const pay = t.closest("[data-pay]");
  if (pay) {
    const emp = DB.employees.find(x => x.id == pay.dataset.pay);
    if (emp) { pushTx({type:"expense", cat:"কর্মচারী বেতন", amt:emp.total, date:pay.dataset.m + "-01", note:emp.name, ref:"e" + emp.id, month:pay.dataset.m}); toast("বেতন পরিশোধ হয়েছে", "ok"); render(); }
    return;
  }
  const rc = t.closest("[data-receipt]"); if (rc) return openReceipt(rc.dataset.receipt);
  if (t.closest("[data-printrep]")) return printDoc(LAST.title, LAST.html);
  if (t.closest("[data-export]")) { $("#backup").value = JSON.stringify(DB); return; }
  if (t.closest("[data-import]")) {
    try { const d = JSON.parse($("#backup").value); if (!d.customers) throw 0; DB = norm(d); save(); render(); toast("পুনরুদ্ধার সম্পন্ন", "ok"); }
    catch(err) { toast("ব্যাকআপের ফরম্যাট সঠিক নয়", "bad"); }
    return;
  }
  if (t.closest("[data-share]")) { if (window.AndroidStore) AndroidStore.share(JSON.stringify(DB)); else toast("শেয়ার শুধু অ্যাপে কাজ করে", "bad"); return; }
  if (t.closest("[data-lock]")) return lockApp("অ্যাপ লক করা হয়েছে।");
  if (t.closest("[data-cloud]")) return cloudRestore();
  if (t.closest("[data-logoremove]")) { DB.settings.logo = ""; save(); render(); return; }
  if (t.closest("[data-clear]")) {
    if (await ask("সব তথ্য মুছবেন?", "কাস্টমার, অর্ডার, কর্মচারী ও হিসাব সব মুছে যাবে। ফিরিয়ে আনা যাবে না।", "সব মুছুন", true)) {
      DB = norm({settings:DB.settings}); save(); toast("সব তথ্য মুছে গেছে"); go("home", null, "replace");
    }
    return;
  }
});
document.addEventListener("input", e => {
  const tg = e.target;
  if (tg.dataset && tg.dataset.q) { LQ[tg.dataset.q] = tg.value; const b = $("#listBody"); if (b) b.innerHTML = listRows(tg.dataset.q); return; }
  const f = tg.form; if (!f) return;
  if (f.dataset.kind === "o") $("#oTotal").value = bn((+f.qty.value || 0) * (+f.price.value || 0));
  if (f.dataset.kind === "e") f.total.value = bn((+f.basic.value || 0) + (+f.extra.value || 0) + (+f.bonus.value || 0));
});
document.addEventListener("change", e => {
  const tg = e.target;
  if (tg.id === "oItem") { $("#measBox").innerHTML = measFields(tg.value, {}); $("#mTitle2").textContent = tg.value; return; }
  if (tg.id === "txType") return fillCats();
  if (tg.id === "accMonth") { if (tg.value) go("accounts", tg.value, "replace"); return; }
  if (tg.id === "logoFile" && tg.files[0]) handleLogo(tg.files[0]);
  if (tg.id === "empPhoto" && tg.files[0]) handleEmpPhoto(tg.files[0]);
});
document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset || !f.dataset.kind) return;
  e.preventDefault();
  const k = f.dataset.kind;
  if (k === "c") saveCust(f); else if (k === "o") saveOrder(f); else if (k === "e") saveEmp(f);
  else if (k === "pay") addPayForm(f); else if (k === "tx") saveTx(f); else if (k === "settings") saveSettings(f);
});
window.addEventListener("popstate", e => {
  const pn = $("#themePanel");
  if (pn) pn.hidden = true;
  if (!$("#modal").hidden && modalDone) modalDone(false);
  const s = e.state || {v:"home", p:null};
  DEPTH = Math.max(0, DEPTH - 1);
  CUR = {v:s.v, p:s.p}; render(); window.scrollTo(0, 0);
});

/* ---------- থিম ---------- */
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  Object.entries(t.v).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  const pn = $("#themePanel");
  if (pn) pn.querySelectorAll(".tp-o").forEach(b => b.classList.toggle("on", b.dataset.theme === t.id));
  try { localStorage.setItem("tms_theme", t.id); } catch(e){}
}
function initTheme(){
  let saved = "navy"; try { saved = localStorage.getItem("tms_theme") || "navy"; } catch(e){}
  const fab = document.createElement("button");
  fab.className = "fab"; fab.title = "থিম"; fab.setAttribute("aria-label", "থিম বেছে নিন");
  fab.style.background = "linear-gradient(135deg,var(--or),var(--or2))";
  fab.innerHTML = svg('<path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7.5" r="1.2"/><circle cx="14.5" cy="7.5" r="1.2"/>').replace("<svg ", '<svg width="24" height="24" style="color:#fff" ');
  const panel = document.createElement("div");
  panel.id = "themePanel"; panel.className = "tpanel"; panel.hidden = true;
  panel.innerHTML = '<div class="tp-t">থিম বেছে নিন</div>' + THEMES.map(t => `<button class="tp-o" data-theme="${t.id}"><span class="sw" style="background:linear-gradient(135deg,${t.a} 50%,${t.b} 50%)"></span>${t.name}</button>`).join("");
  document.body.append(fab, panel);
  fab.addEventListener("click", () => {
    panel.hidden = !panel.hidden;

  });
  document.addEventListener("click", e => { if (!panel.hidden && !panel.contains(e.target) && !fab.contains(e.target)) panel.hidden = true; });
  applyTheme(saved);
}

let _bkTimer = null;
function localBackup(){
  if (!window.AndroidStore) return;
  clearTimeout(_bkTimer);
  _bkTimer = setTimeout(() => { try { AndroidStore.saveBackup(JSON.stringify(DB)); } catch(e){} }, 800);
}
function autoRestore(){
  if (!window.AndroidStore) return;
  if (DB.customers.length || DB.orders.length || DB.employees.length || DB.txs.length) return;
  let txt = ""; try { txt = AndroidStore.readBackup() || ""; } catch(e){}
  if (!txt) return;
  try {
    const d = JSON.parse(txt);
    if (d && d.customers) { DB = norm(d); localStorage.setItem("tms_db", JSON.stringify(DB)); toast("আগের ব্যাকআপ থেকে তথ্য ফিরিয়ে আনা হয়েছে", "ok"); }
  } catch(e){}
}
window.androidBack = () => {
  const pn = $("#themePanel");
  if (pn && !pn.hidden) { pn.hidden = true; return true; }
  if (!$("#modal").hidden && modalDone) { modalDone(false); return true; }
  if (DEPTH > 0) { history.back(); return true; }
  if (CUR.v !== "home") { go("home", null, "replace"); return true; }
  return false;
};
/* ---------- শুরু ---------- */
initTheme();
try { history.replaceState({v:"home", p:null}, ""); } catch(e){}
render();
startApp();
